name: Geocode restaurant addresses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geocode missing coordinates
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        run: python scripts/geocode_restaurants.py
      - name: Validate and export data
        run: |
          python scripts/validate_data.py
          python scripts/export_data.py
      - name: Commit coordinate updates
        run: |
          if git diff --quiet; then
            echo "No coordinate updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json data/restaurants.csv data/restaurants.geojson
          git commit -m "Update restaurant coordinates"
          git push
